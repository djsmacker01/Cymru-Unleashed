<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>We'll Be Right Back</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f0f1e;
            color: #fff;
            overflow: hidden;
            position: relative;
        }

        /* Animated gradient background */
        .background {
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 20% 80%, #5b21b6, transparent 50%),
                radial-gradient(circle at 80% 20%, #1e40af, transparent 50%),
                radial-gradient(circle at 40% 40%, #7c3aed, transparent 50%);
            animation: rotate 30s linear infinite;
            opacity: 0.8;
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        /* Floating particles */
        .particle {
            position: fixed;
            pointer-events: none;
            opacity: 0;
            animation: float 15s infinite;
        }

        @keyframes float {

            0%,
            100% {
                opacity: 0;
                transform: translateY(100vh) scale(0);
            }

            10%,
            90% {
                opacity: 1;
            }

            50% {
                transform: translateY(-100vh) scale(1);
            }
        }

        /* Main container */
        .container {
            text-align: center;
            z-index: 10;
            padding: 40px;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Logo animation */
        .logo {
            width: 120px;
            height: 120px;
            margin: 0 auto 30px;
            position: relative;
        }

        .logo-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 3px solid transparent;
            border-top-color: #7c3aed;
            border-radius: 50%;
            animation: spin 1.5s linear infinite;
        }

        .logo-ring:nth-child(2) {
            width: 80%;
            height: 80%;
            top: 10%;
            left: 10%;
            border-top-color: #3b82f6;
            animation-duration: 2s;
            animation-direction: reverse;
        }

        .logo-ring:nth-child(3) {
            width: 60%;
            height: 60%;
            top: 20%;
            left: 20%;
            border-top-color: #8b5cf6;
            animation-duration: 1s;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        h1 {
            font-size: 3em;
            font-weight: 800;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from {
                filter: drop-shadow(0 0 20px rgba(124, 58, 237, 0.5));
            }

            to {
                filter: drop-shadow(0 0 30px rgba(124, 58, 237, 0.8));
            }
        }

        .subtitle {
            font-size: 1.3em;
            margin-bottom: 40px;
            opacity: 0.9;
            font-weight: 300;
        }

        /* Progress bar */
        .progress-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            margin: 40px 0;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 3px;
            width: 0%;
            animation: progress 3s ease-in-out infinite;
        }

        @keyframes progress {
            0% {
                width: 0%;
            }

            50% {
                width: 100%;
            }

            100% {
                width: 0%;
            }
        }

        /* Countdown timer */
        .countdown {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
        }

        .time-unit {
            text-align: center;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            min-width: 80px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .time-unit:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px -10px rgba(124, 58, 237, 0.5);
        }

        .time-value {
            font-size: 2em;
            font-weight: 700;
            color: #8b5cf6;
        }

        .time-label {
            font-size: 0.8em;
            opacity: 0.7;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Interactive button */
        .notify-btn {
            margin-top: 30px;
            padding: 15px 40px;
            font-size: 1.1em;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .notify-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 35px -10px rgba(124, 58, 237, 0.5);
        }

        .notify-btn:active {
            transform: scale(0.98);
        }

        .notify-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .notify-btn:hover::before {
            width: 300px;
            height: 300px;
        }

        /* Social links */
        .social-links {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .social-link {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #fff;
            transition: all 0.3s ease;
            font-size: 20px;
        }

        .social-link:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-3px) rotate(360deg);
        }

        /* Football Game */
        .game-section {
            margin-top: 40px;
        }

        .football-game {
            width: 100%;
            max-width: 500px;
            height: 300px;
            margin: 0 auto;
            position: relative;
            background: linear-gradient(to bottom, rgba(34, 197, 94, 0.2) 0%, rgba(34, 197, 94, 0.4) 100%);
            border-radius: 20px;
            overflow: hidden;
            cursor: crosshair;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .goal {
            position: absolute;
            width: 150px;
            height: 100px;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
        }

        .goal-net {
            width: 100%;
            height: 100%;
            border: 3px solid #fff;
            border-bottom: none;
            background-image:
                linear-gradient(0deg, rgba(255, 255, 255, 0.2) 0%, rgba(255, 255, 255, 0.2) 100%),
                linear-gradient(90deg, rgba(255, 255, 255, 0.2) 0%, rgba(255, 255, 255, 0.2) 100%);
            background-size: 10px 10px;
            background-position: 0 0, 0 0;
        }

        .goalkeeper {
            position: absolute;
            width: 30px;
            height: 40px;
            background: #f59e0b;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 10px 10px 0 0;
            transition: left 0.3s ease;
        }

        .goalkeeper::before {
            content: '🧤';
            position: absolute;
            top: 5px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 20px;
        }

        .ball {
            position: absolute;
            width: 30px;
            height: 30px;
            background: radial-gradient(circle at 30% 30%, #fff, #000);
            border-radius: 50%;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            transition: none;
            cursor: pointer;
        }

        .ball::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-image:
                linear-gradient(45deg, transparent 40%, #000 40%, #000 60%, transparent 60%),
                linear-gradient(-45deg, transparent 40%, #000 40%, #000 60%, transparent 60%);
            opacity: 0.3;
        }

        .ball.shooting {
            transition: all 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .power-meter {
            position: absolute;
            bottom: 10px;
            left: 20px;
            width: 150px;
            height: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 5px;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .power-meter.active {
            opacity: 1;
        }

        .power-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #10b981, #f59e0b, #ef4444);
            transition: width 0.1s;
        }

        .score-display {
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 1.2em;
            font-weight: bold;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .game-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2em;
            font-weight: bold;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            opacity: 0;
            pointer-events: none;
        }

        .game-message.show {
            animation: messagePopup 1.5s ease-out;
        }

        @keyframes messagePopup {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.5);
            }

            50% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.2);
            }

            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        /* Responsive */
        @media (max-width: 600px) {
            h1 {
                font-size: 2em;
            }

            .countdown {
                flex-wrap: wrap;
                gap: 10px;
            }

            .time-unit {
                min-width: 60px;
                padding: 10px 15px;
            }

            .time-value {
                font-size: 1.5em;
            }

            .football-game {
                height: 250px;
            }
        }
    </style>
</head>

<body>
    <div class="background"></div>

    <div class="container">
        <div class="logo">
            <div class="logo-ring"></div>
            <div class="logo-ring"></div>
            <div class="logo-ring"></div>
        </div>

        <h1>Under Construction</h1>
        <p class="subtitle">We're crafting something extraordinary for you</p>

        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>

        <div class="countdown">
            <div class="time-unit">
                <div class="time-value" id="days">00</div>
                <div class="time-label">Days</div>
            </div>
            <div class="time-unit">
                <div class="time-value" id="hours">00</div>
                <div class="time-label">Hours</div>
            </div>
            <div class="time-unit">
                <div class="time-value" id="minutes">00</div>
                <div class="time-label">Minutes</div>
            </div>
            <div class="time-unit">
                <div class="time-value" id="seconds">00</div>
                <div class="time-label">Seconds</div>
            </div>
        </div>

        <button class="notify-btn" onclick="handleNotify()">Notify Me When Ready</button>

        <div class="game-section">
            <p style="margin: 30px 0 20px; opacity: 0.8;">While you wait, try to score some goals! ⚽</p>
            <div class="football-game" id="gameCanvas">
                <div class="goal">
                    <div class="goal-net"></div>
                    <div class="goalkeeper" id="goalkeeper"></div>
                </div>
                <div class="score-display">Score: <span id="score">0</span></div>
                <div class="ball" id="ball"></div>
                <div class="power-meter">
                    <div class="power-fill" id="powerFill"></div>
                </div>
                <div class="game-message" id="gameMessage"></div>
            </div>
        </div>

        <div class="social-links">
            <a href="#" class="social-link">📧</a>
            <a href="#" class="social-link">🐦</a>
            <a href="#" class="social-link">💼</a>
            <a href="#" class="social-link">📱</a>
        </div>
    </div>

    <script>
        // Create floating particles
        function createParticle() {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.innerHTML = ['✨', '⭐', '💫', '🌟'][Math.floor(Math.random() * 4)];
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDelay = Math.random() * 15 + 's';
            particle.style.fontSize = Math.random() * 20 + 10 + 'px';
            document.body.appendChild(particle);

            setTimeout(() => particle.remove(), 15000);
        }

        // Create particles periodically
        setInterval(createParticle, 2000);

        // Countdown timer
        const targetDate = new Date();
        targetDate.setDate(targetDate.getDate() + 7); // 7 days from now

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = targetDate.getTime() - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById('days').textContent = String(days).padStart(2, '0');
            document.getElementById('hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();

        // Handle notify button
        function handleNotify() {
            const btn = event.target;
            btn.textContent = '✓ You\'ll be notified!';
            btn.style.background = 'linear-gradient(135deg, #10b981 0%, #059669 100%)';

            setTimeout(() => {
                btn.textContent = 'Notify Me When Ready';
                btn.style.background = 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
            }, 3000);
        }

        // Add interactive hover effect to time units
        document.querySelectorAll('.time-unit').forEach(unit => {
            unit.addEventListener('click', function () {
                this.style.transform = 'scale(0.95)';
                setTimeout(() => {
                    this.style.transform = '';
                }, 200);
            });
        });

        // Football Game
        let score = 0;
        let isCharging = false;
        let power = 0;
        let canShoot = true;

        const gameCanvas = document.getElementById('gameCanvas');
        const ball = document.getElementById('ball');
        const goalkeeper = document.getElementById('goalkeeper');
        const powerFill = document.getElementById('powerFill');
        const powerMeter = document.querySelector('.power-meter');
        const scoreDisplay = document.getElementById('score');
        const gameMessage = document.getElementById('gameMessage');

        // Goalkeeper AI movement
        let goalkeeperDirection = 1;
        let goalkeeperPosition = 50;

        function moveGoalkeeper() {
            goalkeeperPosition += goalkeeperDirection * 2;
            if (goalkeeperPosition > 70 || goalkeeperPosition < 30) {
                goalkeeperDirection *= -1;
            }
            goalkeeper.style.left = goalkeeperPosition + '%';
        }

        setInterval(moveGoalkeeper, 50);

        // Power charging
        gameCanvas.addEventListener('mousedown', startCharging);
        gameCanvas.addEventListener('mouseup', shoot);
        gameCanvas.addEventListener('touchstart', startCharging);
        gameCanvas.addEventListener('touchend', shoot);

        function startCharging(e) {
            if (!canShoot) return;
            e.preventDefault();
            isCharging = true;
            powerMeter.classList.add('active');
            chargePower();
        }

        function chargePower() {
            if (!isCharging) return;
            power = Math.min(power + 2, 100);
            powerFill.style.width = power + '%';
            if (power < 100) {
                requestAnimationFrame(chargePower);
            }
        }

        function shoot(e) {
            if (!isCharging || !canShoot) return;
            e.preventDefault();

            isCharging = false;
            canShoot = false;
            powerMeter.classList.remove('active');

            // Get click/touch position
            const rect = gameCanvas.getBoundingClientRect();
            const x = (e.clientX || e.changedTouches[0].clientX) - rect.left;
            const targetX = (x / rect.width) * 100;

            // Calculate trajectory
            const ballBottom = 20 + (power * 2);
            const duration = 800 - (power * 3);

            // Animate ball
            ball.classList.add('shooting');
            ball.style.bottom = ballBottom + 'px';
            ball.style.left = targetX + '%';
            ball.style.transform = `translateX(-50%) rotate(${power * 7.2}deg)`;

            // Check for goal
            setTimeout(() => {
                const ballPos = targetX;
                const goalLeft = 35;
                const goalRight = 65;
                const goalkeeperLeft = goalkeeperPosition - 5;
                const goalkeeperRight = goalkeeperPosition + 5;

                let message = '';

                if (ballPos > goalLeft && ballPos < goalRight) {
                    if (ballBottom > 100 && (ballPos < goalkeeperLeft || ballPos > goalkeeperRight)) {
                        score++;
                        scoreDisplay.textContent = score;
                        message = 'GOAL! 🎉';
                    } else if (ballPos >= goalkeeperLeft && ballPos <= goalkeeperRight) {
                        message = 'SAVED! 🧤';
                    } else {
                        message = 'MISS! 😅';
                    }
                } else {
                    message = 'WIDE! 😬';
                }

                showMessage(message);
                resetBall();
            }, duration);
        }

        function showMessage(text) {
            gameMessage.textContent = text;
            gameMessage.classList.add('show');
            setTimeout(() => {
                gameMessage.classList.remove('show');
            }, 1500);
        }

        function resetBall() {
            setTimeout(() => {
                ball.classList.remove('shooting');
                ball.style.bottom = '20px';
                ball.style.left = '50%';
                ball.style.transform = 'translateX(-50%)';
                power = 0;
                powerFill.style.width = '0%';
                canShoot = true;
            }, 1000);
        }
    </script>
</body>

</html>
